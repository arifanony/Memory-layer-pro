[project]
name = "memory-layer-pro"
version = "0.1.0"
description = "Educational GPT-style memory application (Memory Lab MVP). Synthetic data only."
requires-python = ">=3.11"
dependencies = [
  "streamlit",
  # pyarrow 26 requires NumPy 2, but Intel-mac torch pins numpy<2;
  # keep pyarrow on the numpy-1-compatible line so st.table keeps working.
  "pyarrow>=10.0.1,<21",
  "psycopg[binary]",
  "pgvector",
  "redis",
  "sentence-transformers",
  # torch wheels for Intel macs lag behind numpy 2.x; pin until torch catches up.
  "numpy<2",
  # ... and scipy must match numpy 1.x for the same reason.
  "scipy<1.14",
  # transformers v5 needs a newer torch than Intel-mac wheels provide.
  "transformers<5",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
